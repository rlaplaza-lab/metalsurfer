[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metalsurfer"
version = "0.9.3"
description = "Adsorption on arbitrary materials"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "metalsurfer contributors" }]
keywords = ["adsorption", "screening", "catalysis", "ase", "mlip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26,<2.3",
    "ase",
    "spglib",
    "pandas",
    "pyyaml>=6.0",
    "rdkit>=2024.9,<2026.3.3",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
mlip = [
    "torch",
    "torch-sim-atomistic>=0.5.2",
    "fairchem-core>=2.7",
    "fairchem-data-oc",
    "setuptools>=65,<82",
]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "ruff>=0.16.8,<0.17",
    "mypy>=2.3.1,<2.4",
    "pandas-stubs",
    "scipy-stubs>=1.18,<1.19",
    "types-PyYAML",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-lint",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metalsurfer = ["py.typed"]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fairchem.*",
    "torch_sim.*",
    "torch.*",
    "sklearn.*",
    "joblib.*",
    "threadpoolctl",
    "threadpoolctl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "metalsurfer.placement.site_enumeration",
    "metalsurfer.placement.site_coords",
    "metalsurfer.placement.site_voronoi",
    "metalsurfer.placement.site_classify",
    "metalsurfer.placement.site_np",
    "metalsurfer.placement.site_adaptive_grid",
    "metalsurfer.placement._parallel",
    "metalsurfer.placement.site_plugins",
    "metalsurfer.placement.site_plugins.base",
    "metalsurfer.placement.site_plugins.helpers",
    "metalsurfer.placement.site_plugins.adaptive_grid",
    "metalsurfer.placement.site_plugins.topology_np",
    "metalsurfer.placement.site_plugins.topology_slab",
    "metalsurfer.placement.site_plugins.voronoi",
]
disable_error_code = ["misc", "has-type", "union-attr", "arg-type", "attr-defined"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".pytest_cache", "__pycache__", "*.egg-info", ".ruff_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "ERA",  # commented-out code
    "RET",  # unnecessary return / else
    "RUF100",  # stale noqa
    "FURB105",  # print("") -> print()
    "PGH003",  # blanket type: ignore
    "D",    # full pydocstyle suite (NumPy convention)
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402", "D"]
".github/scripts/**/*.py" = ["D"]
"examples/**/*.py" = ["D", "E402"]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
