[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
markers =
    integration: end-to-end determinism tests
    dependency_behavior: tests for missing optional dependency handling
    mlip: full pipeline with MLIP (torch-sim-atomistic, fairchem); requires GPU or CPU time
    gpu: test requires CUDA GPU; skipped when GPU unavailable (e.g. CI)
    slow: long-running tests (e.g. full MLIP pipeline); exclude with -m "not slow"
    no_fork: run in main process even with --forked (CUDA incompatible with fork)
