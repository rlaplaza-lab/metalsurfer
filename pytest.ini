[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
filterwarnings =
    # spglib >= 2.5 deprecates OLD_ERROR_HANDLING=True; we opt-out in symmetry.py
    # but keep this filter as a safeguard for any indirect calls.
    ignore::DeprecationWarning:spglib
markers =
    integration: end-to-end determinism tests
    dependency_behavior: tests for missing optional dependency handling
    mlip: full pipeline with MLIP (torch-sim-atomistic, fairchem); requires GPU or CPU time
    gpu: test requires CUDA GPU; skipped when GPU unavailable (e.g. CI). Run locally: pytest -m gpu (do not set CUDA_VISIBLE_DEVICES empty). See scripts/run_gpu_tests.sh
    slow: long-running tests (e.g. full MLIP pipeline); exclude with -m "not slow"
    no_fork: run in main process even with --forked (CUDA incompatible with fork)
    docs: documentation consistency guards (config API reference vs source)
