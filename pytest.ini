[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
filterwarnings =
    # spglib >= 2.5 deprecates OLD_ERROR_HANDLING=True; we opt-out in symmetry.py
    # but keep this filter as a safeguard for any indirect calls.
    ignore::DeprecationWarning:spglib
markers =
    quick: default CI suite; pytest -m quick
    cpu: full CPU suite; pytest -m cpu
    integration: stub e2e tests (mocked calculators, no MLIP)
    dependency_behavior: optional-dependency import guards
    mlip: FairChem / torch-sim pipeline (CPU or GPU)
    gpu: CUDA required; pytest -m gpu or scripts/run_gpu_tests.sh
    no_fork: run in main process with --forked (CUDA)
    docs: config API docs match source
