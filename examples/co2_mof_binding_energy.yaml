# CO2 in a MOF — mirrors co2_mof_binding_energy.py
# Run from the project root so slab_file resolves.
campaign: adsorption
surface_type: co2_mof_yaml
substrate:
  material_type: porous
  slab_file: examples/mof_structures/RUBTAK01.cif
  align: false
  slab_relaxation_mode: none
molecules:
  - smiles: O=C=O
    name: CO2
config:
  slab_relaxation_mode: none
  num_conformers: 1
  num_placements: 4
