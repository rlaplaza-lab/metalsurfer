name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Quality: ruff (lint + format) and mypy (src/metalsurfer)
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint and format
        run: ruff check . && ruff format --check .

      - name: Mypy typecheck
        run: |
          # rdkit wheels bundle a broken rdkit-stubs/ tree (not a separate pip package).
          python - <<'PY'
          import pathlib
          import shutil
          import site

          for root in site.getsitepackages():
              stubs = pathlib.Path(root) / "rdkit-stubs"
              if stubs.is_dir():
                  shutil.rmtree(stubs)
          PY
          mypy src/metalsurfer

  # -----------------------------------------------------------------------
  # Unit + integration tests with full optional dependencies
  # -----------------------------------------------------------------------
  test-full:
    runs-on: ubuntu-latest
    env:
      # Ensure CPU-only: no GPU in GitHub Actions; avoids false failures if torch/cuda code runs
      CUDA_VISIBLE_DEVICES: ""
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install numpy ase pandas rdkit scipy scikit-learn

      - name: Install package (editable)
        run: pip install -e .

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            -m "not dependency_behavior and not mlip and not gpu and not slow" \
            --cov=src/metalsurfer --cov-report=xml --cov-report=term-missing \
            --tb=short -v

      - name: Enforce coverage gate
        run: coverage report

  # -----------------------------------------------------------------------
  # Dependency-behavior tests (minimal environment)
  # -----------------------------------------------------------------------
  test-dependency-behavior:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          pip install --upgrade pip
          pip install pytest numpy ase pandas rdkit scipy scikit-learn

      - name: Install package (editable)
        run: pip install -e .

      - name: Run dependency behavior tests
        run: |
          python -m pytest tests/test_dependency_behavior.py -v --tb=short

  # -----------------------------------------------------------------------
  # Integration / determinism tests
  # -----------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest numpy ase pandas rdkit scipy scikit-learn

      - name: Install package (editable)
        run: pip install -e .

      - name: Run integration tests
        run: |
          python -m pytest \
            tests/test_integration_seeded.py \
            tests/test_integration_physics.py \
            tests/test_integration_run_modes.py \
            -v --tb=short

  # -----------------------------------------------------------------------
  # CPU MLIP smoke (gated UMA model download via HF_TOKEN)
  # -----------------------------------------------------------------------
  test-mlip-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Skip when HF_TOKEN is unset
        id: mlip_gate
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN not configured; skipping CPU MLIP smoke."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.mlip_gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.mlip_gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Cache HuggingFace model downloads
        if: steps.mlip_gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-uma-${{ runner.os }}-py3.12
          restore-keys: |
            huggingface-uma-${{ runner.os }}-

      - name: Install CPU PyTorch and MLIP stack
        if: steps.mlip_gate.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[mlip]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu --force-reinstall --no-deps

      - name: Run CPU MLIP unit and smoke tests
        if: steps.mlip_gate.outputs.skip != 'true'
        run: |
          python -m pytest tests/test_optimization.py tests/test_integration_mlip_cpu_smoke.py -m mlip --tb=short -v
