name: Kaggle GPU tests

# GPU CI via Kaggle (see docs/guides/development.rst). CPU CI in ci.yml excludes gpu.
# FairChem/UMA weights need HF_TOKEN (injected into the kernel runner).
#
# mode=smoke (default): gpu_smoke subset via scripts/run_gpu_tests.sh — weekly cron.
# mode=full: entire GPU test suite (manual only; burns Kaggle GPU quota).
# mode=examples: run_all_examples.sh (manual; heavy, T4 ~60 min; bipyridine omitted).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to clone and test on Kaggle
        required: false
        default: main
        type: string
      mode:
        description: >
          smoke = short GPU smoke (default); full = entire CUDA suite;
          examples = run_all_examples.sh. Prefer smoke unless debugging regressions.
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - examples
      marker:
        description: >
          Optional pytest marker override (bypasses run_gpu_tests.sh).
          Leave empty to use METALSURFER_GPU_MODE smoke/full via the script.
        required: false
        default: ""
        type: string
  schedule:
    # Weekly smoke only (UTC Sunday). Full and examples stay manual.
    - cron: "0 6 * * 0"

concurrency:
  group: kaggle-gpu-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}-${{ github.event.inputs.mode || 'smoke' }}
  cancel-in-progress: true

jobs:
  kaggle-gpu:
    name: Kaggle GPU (${{ github.event.inputs.mode || 'smoke' }}, ${{ github.event.inputs.ref || 'main' }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Resolve mode and ref
        id: cfg
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_MARKER: ${{ github.event.inputs.marker }}
        run: |
          REF="${INPUT_REF:-main}"
          MODE="${INPUT_MODE:-smoke}"
          MARKER="${INPUT_MARKER:-}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "marker=${MARKER}" >> "$GITHUB_OUTPUT"
          # Unique kernel slug per mode: concurrent smoke/full/examples runs
          # would otherwise collide on the same kernel (status polling and
          # log downloads always see the latest pushed version).
          echo "slug-suffix=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref=${REF} mode=${MODE} marker=${MARKER:-<script default>}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.ref }}

      - name: Render Kaggle runner script
        env:
          GIT_REF: ${{ steps.cfg.outputs.ref }}
          GPU_MODE: ${{ steps.cfg.outputs.mode }}
          PYTEST_MARKER: ${{ steps.cfg.outputs.marker }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is required for gated UMA model downloads on Kaggle." >&2
            exit 1
          fi
          echo "::add-mask::${HF_TOKEN}"
          python - <<'PY'
          from pathlib import Path
          import os

          template = Path(".github/scripts/kaggle_gpu_runner.template.py").read_text()
          rendered = (
              template.replace("__GIT_REF__", os.environ["GIT_REF"])
              .replace("__GPU_MODE__", os.environ["GPU_MODE"])
              .replace("__PYTEST_MARKER__", os.environ.get("PYTEST_MARKER", ""))
              .replace("__HF_TOKEN__", os.environ["HF_TOKEN"])
          )
          out = Path(".github/scripts/kaggle_gpu_runner.py")
          out.write_text(rendered)
          print(f"Wrote {out} ({len(rendered)} bytes)")
          print(f"mode={os.environ['GPU_MODE']} marker={os.environ.get('PYTEST_MARKER') or '<none>'}")
          PY

      - name: Configure Kaggle credentials
        id: kaggle_creds
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python .github/scripts/setup_kaggle_auth.py --emit-outputs

      - name: Publish CI source bundle to Kaggle dataset
        env:
          GIT_REF: ${{ steps.cfg.outputs.ref }}
        run: |
          python -m pip install --upgrade kaggle
          tar -czf /tmp/metalsurfer-src.tar.gz \
            --exclude=.git \
            --exclude=./dist \
            --exclude='**/__pycache__' \
            --exclude='**/*.pyc' \
            --exclude='./.pytest_cache' \
            --exclude='./.kaggle' \
            --exclude='**/kaggle.json' \
            --exclude='./.env' \
            --exclude='./.github/scripts/kaggle_gpu_runner.py' \
            .
          mkdir -p metalsurfer-dataset
          cp /tmp/metalsurfer-src.tar.gz metalsurfer-dataset/
          cat > metalsurfer-dataset/dataset-metadata.json <<'EOF'
          {
            "title": "Metalsurfer CI Source",
            "id": "rlaplaza/metalsurfercisrc",
            "licenses": [{"name": "MIT"}]
          }
          EOF
          if ! kaggle datasets status rlaplaza/metalsurfercisrc >/dev/null 2>&1; then
            kaggle datasets create -p metalsurfer-dataset
          else
            kaggle datasets version -p metalsurfer-dataset -m "CI bundle for ${GIT_REF}"
          fi
          echo "Waiting for dataset version to finish processing..."
          for attempt in $(seq 1 60); do
            status="$(kaggle datasets status rlaplaza/metalsurfercisrc 2>&1 || true)"
            echo "[$attempt] $status"
            if echo "$status" | grep -Eqi 'complete|ready|done'; then
              break
            fi
            sleep 5
          done
          kaggle datasets files rlaplaza/metalsurfercisrc

      - name: Run tests on Kaggle GPU
        run: |
          python -m pip install --upgrade kaggle
          if [ "${{ steps.cfg.outputs.mode }}" = "examples" ]; then
            TIMEOUT=10800
          elif [ "${{ steps.cfg.outputs.mode }}" = "full" ]; then
            TIMEOUT=10800
          else
            TIMEOUT=3600
          fi
          python .github/scripts/kaggle_run_kernel.py \
            --code-file .github/scripts/kaggle_gpu_runner.py \
            --machine-shape NvidiaTeslaT4 \
            --fetch-seconds 15 \
            --slug-suffix "${{ steps.cfg.outputs.slug-suffix }}" \
            --timeout-seconds "${TIMEOUT}"

      - name: Dump Kaggle kernel log on failure
        if: failure()
        continue-on-error: true
        run: |
          python -m pip install --upgrade kaggle
          python .github/scripts/setup_kaggle_auth.py --require-existing
          python .github/scripts/dump_kaggle_kernel_log.py \
            "metalsurfergpuci-${{ steps.cfg.outputs.slug-suffix }}" /tmp/kaggle-log
